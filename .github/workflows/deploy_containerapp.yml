name: Build Push Deploy (Container App)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  IMAGE_REPO: ${{ vars.IMAGE_REPO }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Resolve deployment variables
        shell: bash
        run: |
          ACR_NAME_VALUE="${ACR_NAME:-acraphidyolo2498}"
          RESOURCE_GROUP_VALUE="${RESOURCE_GROUP:-rg-aphid-yolo-se}"
          CONTAINER_APP_NAME_VALUE="${CONTAINER_APP_NAME:-aca-aphid-yolo}"
          IMAGE_REPO_VALUE="${IMAGE_REPO:-aphid-yolo26}"

          echo "ACR_NAME=$ACR_NAME_VALUE" >> "$GITHUB_ENV"
          echo "RESOURCE_GROUP=$RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_NAME=$CONTAINER_APP_NAME_VALUE" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=$IMAGE_REPO_VALUE" >> "$GITHUB_ENV"

      - name: Sync web pages into docker context
        shell: bash
        run: |
          cp apps/web/web_pages/telemetry_dashboard.html apps/api/container/telemetry_dashboard.html
          cp apps/web/web_pages/local_web_client.html apps/api/container/local_web_client.html
          cp apps/web/web_pages/history_records.html apps/api/container/history_records.html
          cp apps/web/web_pages/decision_dashboard.html apps/api/container/decision_dashboard.html

      - name: Validate docker context files
        shell: bash
        run: |
          test -f apps/api/container/Dockerfile
          test -f apps/api/container/requirements.txt
          test -f apps/api/container/server.py
          test -f apps/api/container/telemetry_dashboard.html
          test -f apps/api/container/local_web_client.html
          test -f apps/api/container/history_records.html
          test -f apps/api/container/decision_dashboard.html
          test -f apps/api/container/model/best.pt
          test -f apps/api/container/model/tepp_demo_scope_model.pkl
          test -f apps/api/container/model/tepp_demo_meta.json

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '411ad807-be68-4d9c-bbe2-d99cfc655c4d' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || '1faf88fe-a998-4c5b-93c9-210a11d9a5c2' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '12190bf7-b4d8-4dfa-9a63-01580c6ad868' }}

      - name: Build and push image to ACR
        shell: bash
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE_TAG="${GITHUB_SHA::12}"
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${IMAGE_TAG}"
          IMAGE_LATEST="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:latest"

          docker build --platform linux/amd64 -t "$IMAGE" -t "$IMAGE_LATEST" apps/api/container
          docker push "$IMAGE"
          docker push "$IMAGE_LATEST"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy image to Azure Container App
        shell: bash
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --image "$IMAGE" \
            --only-show-errors

          FQDN="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP_NAME" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          echo "FQDN=$FQDN" >> "$GITHUB_ENV"

      - name: Health check
        shell: bash
        run: |
          curl -f "https://${FQDN}/health"

      - name: Weekly decision smoke test
        shell: bash
        run: |
          curl -f -X POST "https://${FQDN}/decision/weekly" \
            -H "Content-Type: application/json" \
            -d '{"aphid_count":2,"field_area_ha":1.0}'

      - name: Summary
        shell: bash
        run: |
          echo "Deployed image: $IMAGE"
          echo "App URL: https://${FQDN}"
