<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>蚜虫预测页面</title>
  <style>
    :root {
      --bg: #f3f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --accent: #0f766e;
      --accent-2: #115e59;
      --secondary: #475569;
      --secondary-2: #334155;
      --err: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: linear-gradient(180deg, #f0f6ff 0%, var(--bg) 100%);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans SC", sans-serif;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.06);
    }
    .top-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      background: var(--secondary);
    }
    .nav-btn:hover { background: var(--secondary-2); }
    .nav-btn.active { background: var(--accent); }
    h1 { margin: 0 0 10px 0; font-size: 22px; }
    .muted { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 13px; font-weight: 600; }
    input, button, textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
    }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    button:hover { background: var(--accent-2); }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .secondary { background: var(--secondary); }
    .secondary:hover { background: var(--secondary-2); }
    .result-img-box {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      background: #fbfdff;
    }
    .result-img-title {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #resultCanvas {
      width: 100%;
      max-height: 480px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: none;
      background: #fff;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .error { color: var(--err); }
    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      margin-top: 10px;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 12px; }
      .wrap { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-nav">
      <a class="nav-btn active" href="#">预测</a>
      <a id="telemetryNav" class="nav-btn" href="#">监测</a>
      <a id="historyNav" class="nav-btn" href="#">历史</a>
    </div>

    <h1>Aphid 云端识别客户端</h1>
    <div class="muted">上传图片到 Azure `/predict` 接口，返回 JSON 结果并绘制检测框图片。</div>

    <div class="grid">
      <div class="field" style="grid-column: 1 / -1;">
        <label for="endpoint">接口地址（支持 base URL 或完整 `/predict` 路径）</label>
        <input id="endpoint" type="text" value="https://aca-aphid-yolo.jollystone-e01fd827.swedencentral.azurecontainerapps.io/predict" />
      </div>
      <div class="field">
        <label for="conf">conf</label>
        <input id="conf" type="number" step="0.01" value="0.25" />
      </div>
      <div class="field">
        <label for="iou">iou</label>
        <input id="iou" type="number" step="0.01" value="0.45" />
      </div>
      <div class="field">
        <label for="imgsz">imgsz</label>
        <input id="imgsz" type="number" step="1" value="640" />
      </div>
      <div class="field">
        <label for="maxDet">max_det</label>
        <input id="maxDet" type="number" step="1" value="1000" />
      </div>
      <div class="field" style="grid-column: 1 / -1;">
        <label for="image">选择图片</label>
        <input id="image" type="file" accept="image/*" />
      </div>
    </div>

    <div class="actions">
      <button id="predictBtn">上传并识别</button>
      <button id="healthBtn" class="secondary">检查 Health</button>
    </div>

    <div class="result-img-box">
      <div class="result-img-title">检测框结果图</div>
      <canvas id="resultCanvas"></canvas>
    </div>

    <div id="status" class="status"></div>
    <textarea id="result" readonly placeholder="识别结果 JSON 将显示在这里..."></textarea>
  </div>

  <script>
    const endpointInput = document.getElementById("endpoint");
    const confInput = document.getElementById("conf");
    const iouInput = document.getElementById("iou");
    const imgszInput = document.getElementById("imgsz");
    const maxDetInput = document.getElementById("maxDet");
    const imageInput = document.getElementById("image");
    const predictBtn = document.getElementById("predictBtn");
    const healthBtn = document.getElementById("healthBtn");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");
    const resultCanvas = document.getElementById("resultCanvas");
    const telemetryNav = document.getElementById("telemetryNav");
    const historyNav = document.getElementById("historyNav");

    function configureNavigation() {
      const path = window.location.pathname || "";
      if (path.endsWith("/predict/dashboard")) {
        telemetryNav.href = `${window.location.origin}/telemetry/dashboard`;
        historyNav.href = `${window.location.origin}/history/dashboard`;
      } else {
        telemetryNav.href = "./telemetry_dashboard.html";
        historyNav.href = "./history_records.html";
      }
    }

    function normalizePredictUrl(url) {
      const u = url.trim().replace(/\/+$/, "");
      if (u.endsWith("/predict")) return u;
      return `${u}/predict`;
    }

    function healthUrlFromPredict(predictUrl) {
      return predictUrl.replace(/\/predict$/, "/health");
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = isError ? "status error" : "status";
    }

    function colorFromClassId(classId) {
      const palette = ["#ef4444", "#f59e0b", "#10b981", "#3b82f6", "#8b5cf6", "#ec4899", "#14b8a6"];
      const idx = Math.abs(Number(classId) || 0) % palette.length;
      return palette[idx];
    }

    function drawDetections(imageElement, detections) {
      const ctx = resultCanvas.getContext("2d");
      resultCanvas.width = imageElement.naturalWidth;
      resultCanvas.height = imageElement.naturalHeight;

      ctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
      ctx.drawImage(imageElement, 0, 0);

      for (const det of detections || []) {
        const bbox = det.bbox_xyxy || [];
        if (bbox.length !== 4) continue;
        const [x1, y1, x2, y2] = bbox.map(Number);
        const w = x2 - x1;
        const h = y2 - y1;
        const color = colorFromClassId(det.class_id);
        const label = `${det.class_name || det.class_id} ${(Number(det.confidence) || 0).toFixed(2)}`;

        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(2, Math.round(resultCanvas.width / 500));
        ctx.strokeRect(x1, y1, w, h);

        ctx.font = `${Math.max(14, Math.round(resultCanvas.width / 60))}px sans-serif`;
        const textWidth = ctx.measureText(label).width;
        const textHeight = Math.max(18, Math.round(resultCanvas.width / 45));
        const textX = x1;
        const textY = Math.max(textHeight, y1);

        ctx.fillStyle = color;
        ctx.fillRect(textX, textY - textHeight, textWidth + 10, textHeight);
        ctx.fillStyle = "#ffffff";
        ctx.fillText(label, textX + 5, textY - 5);
      }

      resultCanvas.style.display = "block";
    }

    async function renderImageWithBoxes(file, detections) {
      const objectUrl = URL.createObjectURL(file);
      try {
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = reject;
          img.src = objectUrl;
        });
        drawDetections(img, detections);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    healthBtn.addEventListener("click", async () => {
      try {
        const predictUrl = normalizePredictUrl(endpointInput.value);
        const hUrl = healthUrlFromPredict(predictUrl);
        setStatus(`检查中: ${hUrl}`);
        const res = await fetch(hUrl, { method: "GET" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        setStatus("Health 正常。");
        resultEl.value = JSON.stringify(data, null, 2);
      } catch (err) {
        setStatus(`Health 检查失败: ${err.message}`, true);
      }
    });

    predictBtn.addEventListener("click", async () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) {
        setStatus("请先选择图片。", true);
        return;
      }

      const predictUrl = normalizePredictUrl(endpointInput.value);
      const params = new URLSearchParams({
        conf: confInput.value || "0.25",
        iou: iouInput.value || "0.45",
        imgsz: imgszInput.value || "640",
        max_det: maxDetInput.value || "1000"
      });

      try {
        setStatus("正在上传并推理...");
        resultEl.value = "";
        resultCanvas.style.display = "none";

        const formData = new FormData();
        formData.append("image", file, file.name);

        const res = await fetch(`${predictUrl}?${params.toString()}`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(`HTTP ${res.status} ${txt}`);
        }

        const data = await res.json();
        resultEl.value = JSON.stringify(data, null, 2);
        await renderImageWithBoxes(file, data.detections || []);
        setStatus(`推理成功，检测数量: ${data.count}`);
      } catch (err) {
        setStatus(`调用失败: ${err.message}`, true);
      }
    });

    configureNavigation();
  </script>
</body>
</html>
