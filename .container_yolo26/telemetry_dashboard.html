<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT Telemetry Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --line: #d5dde8;
      --text: #1f2a37;
      --muted: #5f6f82;
      --accent: #0f766e;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      background: linear-gradient(180deg, #ebf4ff 0%, var(--bg) 100%);
      color: var(--text);
      padding: 20px;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .status {
      font-size: 13px;
      margin: 8px 0 12px 0;
      color: var(--muted);
      min-height: 18px;
    }
    .status.err { color: var(--danger); }
    .charts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .chart-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px;
      background: #fbfdff;
    }
    .chart-title {
      margin: 4px 6px 8px 6px;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>IoT Telemetry Dashboard</h1>
    <div class="grid">
      <div>
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" placeholder="https://your-app.azurecontainerapps.io" />
      </div>
      <div>
        <label for="deviceId">Device ID</label>
        <input id="deviceId" value="pi-001" />
      </div>
      <div>
        <label for="apiKey">X-API-Key (optional)</label>
        <input id="apiKey" type="password" placeholder="API key" />
      </div>
      <div>
        <button id="loadBtn">Load</button>
      </div>
    </div>
    <div id="status" class="status"></div>
    <div class="charts">
      <div class="chart-card">
        <div class="chart-title">Temperature</div>
        <canvas id="tempChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Humidity</div>
        <canvas id="humChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">Light</div>
        <canvas id="lightChart" height="120"></canvas>
      </div>
    </div>
  </div>

  <script>
    const defaultBase = window.location.origin;
    const baseEl = document.getElementById("baseUrl");
    const deviceEl = document.getElementById("deviceId");
    const keyEl = document.getElementById("apiKey");
    const loadBtn = document.getElementById("loadBtn");
    const statusEl = document.getElementById("status");

    baseEl.value = defaultBase;

    function setStatus(text, isErr = false) {
      statusEl.textContent = text;
      statusEl.className = isErr ? "status err" : "status";
    }

    function mkChart(canvasId, label, color) {
      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label,
            data: [],
            borderColor: color,
            backgroundColor: "transparent",
            tension: 0.2,
            pointRadius: 2
          }]
        },
        options: {
          responsive: true,
          animation: false,
          scales: {
            x: { ticks: { maxTicksLimit: 8 } }
          }
        }
      });
    }

    const tempChart = mkChart("tempChart", "temperature", "#ef4444");
    const humChart = mkChart("humChart", "humidity", "#3b82f6");
    const lightChart = mkChart("lightChart", "light", "#f59e0b");

    function applySeries(chart, labels, values) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
    }

    async function loadLatest() {
      const base = baseEl.value.trim().replace(/\/+$/, "");
      const device = deviceEl.value.trim();
      const apiKey = keyEl.value.trim();

      if (!base || !device) {
        setStatus("Base URL and Device ID are required.", true);
        return;
      }

      const url = `${base}/telemetry/latest?device_id=${encodeURIComponent(device)}&limit=200`;
      const headers = {};
      if (apiKey) headers["X-API-Key"] = apiKey;

      try {
        setStatus(`Loading ${url}`);
        const resp = await fetch(url, { headers });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(`HTTP ${resp.status} ${txt}`);
        }

        const data = await resp.json();
        const items = (data.items || []).slice().reverse();
        const labels = items.map(x => x.ts || "");

        applySeries(tempChart, labels, items.map(x => x.temperature));
        applySeries(humChart, labels, items.map(x => x.humidity));
        applySeries(lightChart, labels, items.map(x => x.light));

        setStatus(`Loaded ${items.length} points for ${device}`);
      } catch (err) {
        setStatus(`Load failed: ${err.message}`, true);
      }
    }

    loadBtn.addEventListener("click", loadLatest);
    setInterval(loadLatest, 10000);
  </script>
</body>
</html>
