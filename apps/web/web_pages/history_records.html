<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>识别历史记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg-start: #e8f0fe;
      --bg-end: #f0f4f8;
      --card: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.45);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #0d9488;
      --accent-dark: #0f766e;
      --accent-glow: rgba(13, 148, 136, 0.35);
      --gradient-btn: linear-gradient(135deg, #0d9488, #065f46);
      --gradient-btn-hover: linear-gradient(135deg, #14b8a6, #0d9488);
      --danger: #dc2626;
      --radius: 20px;
      --radius-sm: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animated background blobs ── */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #5eead4 0%, transparent 70%);
      top: -120px;
      left: -80px;
      animation: blobDrift 18s ease-in-out infinite alternate;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #a78bfa 0%, transparent 70%);
      bottom: -100px;
      right: -60px;
      animation: blobDrift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobDrift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.08);
      }

      100% {
        transform: translate(-20px, 20px) scale(0.95);
      }
    }

    /* ── Glassmorphism card ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1060px;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.04);
      animation: fadeSlideUp 0.6s ease-out both;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Segmented nav ── */
    .top-nav {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.06);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 22px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      background: transparent;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.5);
    }

    .nav-btn.active {
      color: #fff;
      background: var(--gradient-btn);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* ── Heading ── */
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Controls ── */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
      transition: all 0.25s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3.5px var(--accent-glow);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--gradient-btn);
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.25s ease;
      width: 100%;
    }

    button:hover {
      background: var(--gradient-btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    button:active {
      transform: translateY(0);
    }

    /* ── Status ── */
    .status {
      font-size: 13px;
      margin: 0 0 20px 0;
      color: var(--muted);
      font-weight: 500;
      min-height: 18px;
    }

    .status.err {
      color: var(--danger);
    }

    /* ── Chart box ── */
    .chart-box {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      margin-bottom: 24px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .chart-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .chart-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
    }

    /* ── Record cards ── */
    .record-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .record-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .record-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }

    .record-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .record-time {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .record-time::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
    }

    .record-count {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      background: var(--gradient-btn);
      border-radius: 20px;
      padding: 3px 12px;
      min-width: 36px;
      text-align: center;
      box-shadow: 0 2px 8px var(--accent-glow);
      line-height: 1.4;
    }

    .record-meta {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .record-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 13px;
      line-height: 1.5;
    }

    .record-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      min-width: 62px;
    }

    .record-value {
      color: var(--text);
      word-break: break-all;
      font-weight: 500;
    }

    .record-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 4px;
      border-top: 1px solid var(--line);
    }

    .record-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid rgba(13, 148, 136, 0.25);
      background: rgba(13, 148, 136, 0.06);
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .record-link:hover {
      background: rgba(13, 148, 136, 0.14);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(13, 148, 136, 0.15);
    }

    .record-link-icon {
      font-size: 14px;
      line-height: 1;
    }

    .no-records {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      padding: 40px 20px;
      font-weight: 500;
    }

    @media (max-width: 820px) {
      .controls {
        grid-template-columns: 1fr;
      }

      body {
        padding: 16px 12px;
      }

      .wrap {
        padding: 20px;
        border-radius: 16px;
      }

      h1 {
        font-size: 22px;
      }

      .record-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <!-- Page layout: history controls, status, trend chart, and card list -->
  <div class="wrap">
    <!-- Shared top navigation across predict/telemetry/history/decision dashboards -->
    <div class="top-nav">
      <a id="predictNav" class="nav-btn" href="#">预测</a>
      <a id="telemetryNav" class="nav-btn" href="#">监测</a>
      <a class="nav-btn active" href="#">历史</a>
      <a id="decisionNav" class="nav-btn" href="#">Decision</a>
    </div>

    <h1>识别历史记录</h1>

    <!-- Query controls for /history endpoint -->
    <div class="controls">
      <div>
        <label for="baseUrl">历史接口地址（支持 base URL 或完整 /history）</label>
        <input id="baseUrl"
          value="https://aca-aphid-yolo.salmonforest-9615860e.swedencentral.azurecontainerapps.io/history" />
      </div>
      <div>
        <label for="limit">Limit</label>
        <input id="limit" type="number" min="1" max="500" value="50" />
      </div>
      <div>
        <button id="loadBtn">加载历史</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <!-- History count trend line chart -->
    <div class="chart-box">
      <div class="chart-title">检测数量趋势（Count Trend）</div>
      <canvas id="countTrendChart" height="100"></canvas>
    </div>

    <!-- Record card container (rendered dynamically) -->
    <div id="historyBody" class="record-grid"></div>
  </div>

  <script>
    // DOM references and shared navigation links.
    const baseEl = document.getElementById("baseUrl");
    const limitEl = document.getElementById("limit");
    const loadBtn = document.getElementById("loadBtn");
    const statusEl = document.getElementById("status");
    const bodyEl = document.getElementById("historyBody");
    const predictNav = document.getElementById("predictNav");
    const telemetryNav = document.getElementById("telemetryNav");
    const decisionNav = document.getElementById("decisionNav");
    const trendCanvas = document.getElementById("countTrendChart");
    let trendChart = null;

    // Route links are different in local static mode vs API-hosted dashboard mode.
    function configureNavigation() {
      const path = window.location.pathname || "";
      if (path.endsWith("/history/dashboard")) {
        predictNav.href = `${window.location.origin}/predict/dashboard`;
        telemetryNav.href = `${window.location.origin}/telemetry/dashboard`;
        decisionNav.href = `${window.location.origin}/decision/dashboard`;
      } else {
        predictNav.href = "./local_web_client.html";
        telemetryNav.href = "./telemetry_dashboard.html";
        decisionNav.href = "./decision_dashboard.html";
      }
    }

    // Status banner helper for success/error feedback.
    function setStatus(text, isErr = false) {
      statusEl.textContent = text;
      statusEl.className = isErr ? "status err" : "status";
    }

    // Render API records into responsive cards.
    function renderRows(records) {
      bodyEl.innerHTML = "";
      if (!records || records.length === 0) {
        bodyEl.innerHTML = '<div class="no-records">暂无历史记录</div>';
        return;
      }
      for (const r of records) {
        const card = document.createElement("div");
        card.className = "record-card";

        const time = r.timestamp_utc || r.history_last_modified_utc || "";
        const req = r.request_id || "";
        const fname = r.filename || "";
        const count = Number.isFinite(Number(r.count)) ? Number(r.count) : "-";

        let linksHtml = '';
        const imageUrl = r.image_view_url || r.image_blob_url;
        if (imageUrl) {
          linksHtml += `<a class="record-link" href="${imageUrl}" target="_blank" rel="noopener"><span class="record-link-icon">🖼️</span>${r.image_blob_name || '查看图片'}</a>`;
        }
        const historyUrl = r.history_view_url || r.history_blob_url;
        if (historyUrl) {
          linksHtml += `<a class="record-link" href="${historyUrl}" target="_blank" rel="noopener"><span class="record-link-icon">📄</span>${r.history_blob_name || '查看记录'}</a>`;
        }

        card.innerHTML = `
          <div class="record-header">
            <span class="record-time">${time}</span>
            <span class="record-count">${count}</span>
          </div>
          <div class="record-meta">
            <div class="record-row">
              <span class="record-label">文件</span>
              <span class="record-value">${fname || '-'}</span>
            </div>
            <div class="record-row">
              <span class="record-label">请求 ID</span>
              <span class="record-value">${req || '-'}</span>
            </div>
          </div>
          ${linksHtml ? `<div class="record-links">${linksHtml}</div>` : ''}
        `;
        bodyEl.appendChild(card);
      }
    }

    function formatTimeLabel(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return String(ts);
      return d.toISOString().slice(11, 19);
    }

    // Build/update the Chart.js count trend from history records.
    function renderCountTrend(records) {
      const ordered = (records || []).slice().reverse();
      const labels = ordered.map(r => formatTimeLabel(r.timestamp_utc || r.history_last_modified_utc));
      const values = ordered.map(r => {
        const n = Number(r.count);
        return Number.isFinite(n) ? n : 0;
      });

      if (!trendChart) {
        trendChart = new Chart(trendCanvas, {
          type: "line",
          data: {
            labels,
            datasets: [{
              label: "count",
              data: values,
              borderColor: "#0d9488",
              backgroundColor: "rgba(13, 148, 136, 0.12)",
              fill: true,
              tension: 0.35,
              pointRadius: 2,
              borderWidth: 2.5
            }]
          },
          options: {
            responsive: true,
            animation: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                backgroundColor: "rgba(15, 23, 42, 0.85)",
                titleFont: { family: "Inter" },
                bodyFont: { family: "Inter" },
                cornerRadius: 8,
                padding: 10
              }
            },
            scales: {
              x: {
                ticks: { maxTicksLimit: 10, font: { family: "Inter", size: 11 }, color: "#94a3b8" },
                grid: { color: "rgba(0,0,0,0.04)" }
              },
              y: {
                beginAtZero: true,
                ticks: { font: { family: "Inter", size: 11 }, color: "#94a3b8" },
                grid: { color: "rgba(0,0,0,0.04)" }
              }
            }
          }
        });
        return;
      }

      trendChart.data.labels = labels;
      trendChart.data.datasets[0].data = values;
      trendChart.update();
    }

    // Accept base URL or full /history endpoint.
    function normalizeHistoryUrl(url) {
      const u = (url || "").trim().replace(/\/+$/, "");
      if (u.endsWith("/history")) return u;
      return `${u}/history`;
    }

    // Load records from API and refresh both table cards and chart.
    async function loadHistory() {
      const historyBase = normalizeHistoryUrl(baseEl.value);
      const limit = limitEl.value || "50";
      if (!historyBase) {
        setStatus("历史接口地址不能为空。", true);
        return;
      }

      const url = `${historyBase}?limit=${encodeURIComponent(limit)}`;
      try {
        setStatus(`加载中: ${url}`);
        const resp = await fetch(url);
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(`HTTP ${resp.status} ${txt}`);
        }
        const data = await resp.json();
        renderRows(data.records || []);
        renderCountTrend(data.records || []);
        setStatus(`加载成功，共 ${data.count ?? 0} 条记录。`);
      } catch (err) {
        setStatus(`加载失败: ${err.message}`, true);
      }
    }

    loadBtn.addEventListener("click", loadHistory);
    configureNavigation();
  </script>
</body>

</html>
