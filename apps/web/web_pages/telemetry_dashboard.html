<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IoT 监测页面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ── Design tokens ── */
    :root {
      --bg-start: #e8f0fe;
      --bg-end: #f0f4f8;
      --card: rgba(255, 255, 255, 0.65);
      --card-border: rgba(255, 255, 255, 0.45);
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #0d9488;
      --accent-dark: #0f766e;
      --accent-glow: rgba(13, 148, 136, 0.35);
      --gradient-btn: linear-gradient(135deg, #0d9488, #065f46);
      --gradient-btn-hover: linear-gradient(135deg, #14b8a6, #0d9488);
      --secondary: #475569;
      --danger: #dc2626;
      --radius: 20px;
      --radius-sm: 12px;
      --temp-color: #ef4444;
      --hum-color: #3b82f6;
      --light-color: #f59e0b;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", "Segoe UI", "Noto Sans SC", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Animated background blobs ── */
    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #5eead4 0%, transparent 70%);
      top: -120px;
      left: -80px;
      animation: blobDrift 18s ease-in-out infinite alternate;
    }

    body::after {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #a78bfa 0%, transparent 70%);
      bottom: -100px;
      right: -60px;
      animation: blobDrift 22s ease-in-out infinite alternate-reverse;
    }

    @keyframes blobDrift {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.08);
      }

      100% {
        transform: translate(-20px, 20px) scale(0.95);
      }
    }

    /* ── Glassmorphism card ── */
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 1060px;
      margin: 0 auto;
      background: var(--card);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07), 0 2px 6px rgba(0, 0, 0, 0.04);
      animation: fadeSlideUp 0.6s ease-out both;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Segmented nav ── */
    .top-nav {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.06);
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 28px;
      gap: 4px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 22px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      color: var(--muted);
      background: transparent;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.5);
    }

    .nav-btn.active {
      color: #fff;
      background: var(--gradient-btn);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* ── Heading ── */
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent-dark) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── Controls grid ── */
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text);
      transition: all 0.25s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3.5px var(--accent-glow);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius-sm);
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: var(--gradient-btn);
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.25s ease;
      width: 100%;
    }

    button:hover {
      background: var(--gradient-btn-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    button:active {
      transform: translateY(0);
    }

    /* ── Status ── */
    .status {
      font-size: 13px;
      margin: 0 0 20px 0;
      color: var(--muted);
      font-weight: 500;
      min-height: 18px;
    }

    .status.err {
      color: var(--danger);
    }

    /* ── Chart cards ── */
    .charts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .chart-card {
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    .chart-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .chart-badge {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .chart-badge.temp {
      background: var(--temp-color);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
    }

    .chart-badge.hum {
      background: var(--hum-color);
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }

    .chart-badge.light {
      background: var(--light-color);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }

    .chart-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @media (max-width: 820px) {
      .controls {
        grid-template-columns: 1fr;
      }

      body {
        padding: 16px 12px;
      }

      .wrap {
        padding: 20px;
        border-radius: 16px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <!-- Page layout: telemetry query controls + three time-series charts -->
  <div class="wrap">
    <!-- Shared top navigation across predict/telemetry/history/decision dashboards -->
    <div class="top-nav">
      <a id="predictNav" class="nav-btn" href="#">预测</a>
      <a id="telemetryNav" class="nav-btn active" href="#">监测</a>
      <a id="historyNav" class="nav-btn" href="#">历史</a>
      <a id="decisionNav" class="nav-btn" href="#">Decision</a>
    </div>

    <h1>IoT Telemetry Dashboard</h1>

    <!-- Query controls for /telemetry/latest -->
    <div class="controls">
      <div>
        <label for="baseUrl">Base URL</label>
        <input id="baseUrl" placeholder="https://your-app.azurecontainerapps.io" />
      </div>
      <div>
        <label for="deviceId">Device ID</label>
        <input id="deviceId" value="pi-001" />
      </div>
      <div>
        <label for="apiKey">X-API-Key (optional)</label>
        <input id="apiKey" type="password" placeholder="API key" />
      </div>
      <div>
        <button id="loadBtn">Load</button>
      </div>
    </div>

    <div id="status" class="status"></div>

    <!-- Chart area: temperature, humidity, and light -->
    <div class="charts">
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-badge temp"></span>
          <span class="chart-title">Temperature</span>
        </div>
        <canvas id="tempChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-badge hum"></span>
          <span class="chart-title">Humidity</span>
        </div>
        <canvas id="humChart" height="120"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-header">
          <span class="chart-badge light"></span>
          <span class="chart-title">Light</span>
        </div>
        <canvas id="lightChart" height="120"></canvas>
      </div>
    </div>
  </div>

  <script>
    // DOM references and shared navigation links.
    const defaultBase = "https://aca-aphid-yolo.jollystone-e01fd827.swedencentral.azurecontainerapps.io";
    const baseEl = document.getElementById("baseUrl");
    const deviceEl = document.getElementById("deviceId");
    const keyEl = document.getElementById("apiKey");
    const loadBtn = document.getElementById("loadBtn");
    const statusEl = document.getElementById("status");
    const predictNav = document.getElementById("predictNav");
    const historyNav = document.getElementById("historyNav");
    const decisionNav = document.getElementById("decisionNav");

    // Route links are different in local static mode vs API-hosted dashboard mode.
    function configureNavigation() {
      const path = window.location.pathname || "";
      if (path.endsWith("/telemetry/dashboard")) {
        predictNav.href = `${window.location.origin}/predict/dashboard`;
        historyNav.href = `${window.location.origin}/history/dashboard`;
        decisionNav.href = `${window.location.origin}/decision/dashboard`;
      } else {
        predictNav.href = "./local_web_client.html";
        historyNav.href = "./history_records.html";
        decisionNav.href = "./decision_dashboard.html";
      }
    }

    baseEl.value = defaultBase;

    // Status banner helper for success/error feedback.
    function setStatus(text, isErr = false) {
      statusEl.textContent = text;
      statusEl.className = isErr ? "status err" : "status";
    }

    // Reusable Chart.js line-chart factory.
    function mkChart(canvasId, label, color) {
      return new Chart(document.getElementById(canvasId), {
        type: "line",
        data: {
          labels: [],
          datasets: [{
            label,
            data: [],
            borderColor: color,
            backgroundColor: "transparent",
            tension: 0.35,
            pointRadius: 2,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          animation: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.85)",
              titleFont: { family: "Inter" },
              bodyFont: { family: "Inter" },
              cornerRadius: 8,
              padding: 10
            }
          },
          scales: {
            x: {
              ticks: { maxTicksLimit: 8, font: { family: "Inter", size: 11 }, color: "#94a3b8" },
              grid: { color: "rgba(0,0,0,0.04)" }
            },
            y: {
              ticks: { font: { family: "Inter", size: 11 }, color: "#94a3b8" },
              grid: { color: "rgba(0,0,0,0.04)" }
            }
          }
        }
      });
    }

    const tempChart = mkChart("tempChart", "temperature", "#ef4444");
    const humChart = mkChart("humChart", "humidity", "#3b82f6");
    const lightChart = mkChart("lightChart", "light", "#f59e0b");

    // Apply new points and redraw chart.
    function applySeries(chart, labels, values) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = values;
      chart.update();
    }

    // Load latest telemetry points for one device and refresh all charts.
    async function loadLatest() {
      const base = baseEl.value.trim().replace(/\/+$/, "");
      const device = deviceEl.value.trim();
      const apiKey = keyEl.value.trim();

      if (!base || !device) {
        setStatus("Base URL and Device ID are required.", true);
        return;
      }

      const url = `${base}/telemetry/latest?device_id=${encodeURIComponent(device)}&limit=200`;
      const headers = {};
      if (apiKey) headers["X-API-Key"] = apiKey;

      try {
        setStatus(`Loading ${url}`);
        const resp = await fetch(url, { headers });
        if (!resp.ok) {
          const txt = await resp.text();
          throw new Error(`HTTP ${resp.status} ${txt}`);
        }

        const data = await resp.json();
        const items = (data.items || []).slice().reverse();
        const labels = items.map(x => x.ts || "");

        applySeries(tempChart, labels, items.map(x => x.temperature));
        applySeries(humChart, labels, items.map(x => x.humidity));
        applySeries(lightChart, labels, items.map(x => x.light));

        setStatus(`Loaded ${items.length} points for ${device}`);
      } catch (err) {
        setStatus(`Load failed: ${err.message}`, true);
      }
    }

    loadBtn.addEventListener("click", loadLatest);
    setInterval(loadLatest, 10000);

    configureNavigation();
  </script>
</body>

</html>
